{% load static %}
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <title>Farm Harvest Manager</title>
    <link href="{% static 'css/tabler.css' %}" rel="stylesheet"/>
    <link href="{% static 'css/tabler-flags.css' %}" rel="stylesheet"/>
    <link href="{% static 'css/tabler-socials.css' %}" rel="stylesheet"/>
    <link href="{% static 'css/tabler-payments.css' %}" rel="stylesheet"/>
    <link href="{% static 'css/tabler-vendors.css' %}" rel="stylesheet"/>
    <link href="{% static 'css/tabler-marketing.css' %}" rel="stylesheet"/>
    <link href="{% static 'css/tabler-themes.css' %}" rel="stylesheet"/>
    <link href="{% static 'css/app-theme.css' %}" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    @import url("https://rsms.me/inter/inter.css");
    </style>
  </head>

  <body>
    <div class="page">

        {% if request.user.is_authenticated %}
            {% include 'theme/sidebar.html' %}
        {% endif %}

        <div class="page-wrapper">
            <div class="page-body">
                <div class="container-xl">
                    {% block content %}
                    {% endblock %}
                </div>
            </div>
            {% include 'theme/footer.html' %}
        </div>
    </div>

    {% include 'theme/settings.html' %}

    <script src="{% static 'js/tabler-theme.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/tabler.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
