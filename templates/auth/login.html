{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="dark" data-bs-theme-primary="blue">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>
    HarvestLog Management System
  </title>
  <link href="{% static 'libs/jsvectormap/dist/jsvectormap.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-flags.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-socials.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-payments.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-vendors.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-marketing.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-themes.css' %}" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div class="page page-center">
    <div class="container container-tight py-4">

     <div class="card card-md">
      <div class="card-body">

        <center class="mt-n4">
        <i class='fas fa-tractor' style='font-size:50px'></i>
        </center>
        <h2 class="h3 text-center mb-4">Harvest System</h2>

        <form method="post" id="login-form" autocomplete="off">
          {% csrf_token %}

          {% if messages %}
          {% for message in messages %}
          <div id="error-message" class="alert alert-danger">
            {{ message }}
          </div>
          {% endfor %}
          {% endif %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" id="login-username" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" {% if locked %}disabled{% endif %}>
          </div>
          <div class="mb-2">
            <label class="form-label">
              Password
            </label>
            <div class="input-group input-group-flat">
              <input type="password" class="form-control" name="password" id="login-password" autocomplete="new-password" {% if locked %}disabled{% endif %}>
              <button type="button" class="input-group-text" id="toggleLoginPassword" aria-label="Show password" style="cursor: pointer;" {% if locked %}disabled{% endif %}>
                <i class="fas fa-eye" id="loginEyeIcon"></i>
              </button>
            </div>
          </div>
          <div class="form-footer d-flex justify-content-center">
            <button type="submit" class="btn btn-primary w-50">
              <i class="fas fa-sign-in-alt me-1"></i> Sign in
            </button>
          </div>
       </form>
     </div>
   </div>
 </div>
 <!-- <div class="text-center text-secondary mt-n1">
  Don't have an account?
  <a href="{% url 'register' %}" class="text-primary fw-bold">Register</a>
 </div> -->
</div>

<script src="{% static 'js/tabler.js' %}" defer></script>
<script src="{% static 'js/demo.js' %}" defer></script>
{% if locked %}
<script>
  let remaining = {{ remaining }};
  const messageBox = document.getElementById("error-message");

  let interval = setInterval(function() {
    remaining--;

    if (remaining > 0) {
      messageBox.innerHTML =
      "Too many failed attempts. Try again in " + remaining + " seconds.";
    } else {
      clearInterval(interval);
      window.location.href = "{% url 'login' %}";
    }

  }, 1000);
</script>
{% endif %}
<script>
  (function () {
    var form = document.getElementById("login-form");
    if (!form) return;

    var username = document.getElementById("login-username");
    var password = document.getElementById("login-password");
    var toggle = document.getElementById("toggleLoginPassword");
    var eyeIcon = document.getElementById("loginEyeIcon");

    function clearCredentials() {
      if (username) username.value = "";
      if (password) password.value = "";
    }

    // Clear anything the browser restored or auto-filled, including
    // values kept in the back/forward cache.
    document.addEventListener("DOMContentLoaded", clearCredentials);
    window.addEventListener("pageshow", clearCredentials);
    window.addEventListener("load", function () {
      setTimeout(clearCredentials, 100);
    });

    if (toggle && password && eyeIcon) {
      toggle.addEventListener("click", function () {
        var show = password.type === "password";
        password.type = show ? "text" : "password";

        eyeIcon.classList.toggle("fa-eye", !show);
        eyeIcon.classList.toggle("fa-eye-slash", show);
        toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    }
  })();
</script>
</body>
</html>
