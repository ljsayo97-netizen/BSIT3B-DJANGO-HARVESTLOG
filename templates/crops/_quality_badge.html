{% if grade %}
{% if grade == 'premium' %}
<span class="badge bg-success-lt text-success">{{ label|default:"Premium" }}</span>
{% elif grade == 'grade_a' %}
<span class="badge bg-primary-lt text-primary">{{ label|default:"Grade A" }}</span>
{% elif grade == 'grade_b' %}
<span class="badge bg-dark-lt text-dark">{{ label|default:"Standard" }}</span>
{% endif %}
{% else %}
<span class="text-muted">—</span>
{% endif %}
